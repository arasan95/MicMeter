name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            framework: net10.0-windows
            artifact: MicMeter-win-x64
          - os: macos-latest
            runtime: osx-arm64
            framework: net10.0
            artifact: MicMeter-osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/MicMeter.Core.Tests/MicMeter.Core.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish src/MicMeter/MicMeter.csproj --configuration Release --runtime ${{ matrix.runtime }} --framework ${{ matrix.framework }} --self-contained false -p:PublishSingleFile=true --output artifacts/${{ matrix.artifact }}

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: bash scripts/package-macos.sh artifacts/${{ matrix.artifact }} artifacts

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.artifact }}/
            artifacts/MicMeter.app/
          if-no-files-found: warn
